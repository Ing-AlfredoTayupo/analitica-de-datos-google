<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Data Analytics Prep</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
</head>
<body>

<div class="app-container">
    <header class="header">
        <h1>Data Analytics Prep</h1>
        <button class="icon-btn" id="settings-trigger">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.43-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>
        </button>
    </header>

    <main class="content">
        <section id="view-exams" class="view">
            <h2 class="section-title">Cursos de la Certificación</h2>
            <div id="exams-accordion" class="accordion"></div>
        </section>

        <section id="view-summary" class="view hidden">
            <h2 class="section-title">Resúmenes Teóricos</h2>
            <div id="summary-accordion" class="accordion"></div>
        </section>

        <section id="view-quiz" class="view hidden">
            <div class="quiz-header">
                <span id="quiz-title">Prueba</span>
                <span id="q-counter">0/0</span>
            </div>
            <div class="progress-container">
                <div id="progress-fill" class="progress-fill"></div>
            </div>
            <div id="q-text" class="question-text"></div>
            <div id="options-container" class="options-grid"></div>
            <button id="btn-next" class="btn-primary">Siguiente</button>
        </section>

        <section id="view-results" class="view hidden">
            <div class="result-card">
                <div id="result-score" class="score-badge">0%</div>
                <h3 id="result-status">Estado</h3>
            </div>
            <div id="feedback-container"></div>
            <button id="btn-finish" class="btn-primary">Cerrar y Guardar</button>
        </section>
    </main>

    <nav class="bottom-nav">
        <button class="nav-item" data-view="view-summary">
            <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
            <span>Resúmenes</span>
        </button>
        <button class="nav-item active" data-view="view-exams">
            <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-8.5 13.5l-3.5-3.5 1.41-1.41L10.5 13.67l5.59-5.59L17.5 9.5l-7 7z"/></svg>
            <span>Exámenes</span>
        </button>
    </nav>
</div>

<script src="datos_coursera.js"></script>
<script src="app.js"></script>
</body>
</html>
